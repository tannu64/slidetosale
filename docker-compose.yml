services:
  db:
    image: postgres:16
    container_name: slidetosale-db
    environment:
      POSTGRES_USER: slidetosale
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: slidetosale
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
